services:
  claude-code:
    build: .
    image: lkf-claude-code:latest
    container_name: lkf-claude-code
    volumes:
      - ${LKF_HOST_PATH:-$HOME/lkf}:${LKF_HOST_PATH:-$HOME/lkf}
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/lkf/lkf-claude-memory:/home/node/lkf/lkf-claude-memory
      - ${HOME}/.claude.json:/home/node/.claude.json
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    working_dir: ${LKF_HOST_PATH:-$HOME/lkf}
    stdin_open: true
    tty: true
