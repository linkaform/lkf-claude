<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c10-text-muted);font-weight:600}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Field, Select, Checkbox, Radio, Switch } = window.Clave10DesignSystem_b774bd;
function Demo(){
const [c,setC]=React.useState(true);const [s,setS]=React.useState(true);const [r,setR]=React.useState("entrada");
return (<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"20px"}}>
<div>
<Field label="Usuario"><Input placeholder="Usuario" defaultValue="ana.ruiz"/></Field>
<Field label="Ubicación"><Select options={["Planta Monterrey","Planta Norte","CEDIS Apodaca"]} placeholder="Seleccionar ubicación"/></Field>
<Field label="Folio" error="Campo obligatorio"><Input placeholder="F-00000" invalid/></Field>
</div>
<div>
<Field label="Comentarios" hint="Máximo 500 caracteres"><Textarea placeholder="Descripción de la incidencia" rows={3}/></Field>
<div className="row" style={{gap:20}}>
<Checkbox checked={c} label="Planta Norte" onChange={setC}/>
<Radio checked={r==="entrada"} label="Entrada" onChange={()=>setR("entrada")}/>
<Radio checked={r==="salida"} label="Salida" onChange={()=>setR("salida")}/>
<Switch checked={s} label="Notificar" onChange={setS}/>
</div></div></div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
