<!-- @dsCard group="Components" viewport="1280x620" name="Detail panel" subtitle="Panel lateral de detalle, redimensionable arrastrando el borde" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden}body{background:var(--surface-app);font-family:var(--font-sans);color:var(--text-body)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { DetailPanel, DetailSection, DetailField, DataTable, EstatusBadge, RowAction, Button, KpiChip } = window.Clave10DesignSystem_b774bd;
const Ico=({d})=> <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const Print=()=> <Ico d={<><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></>}/>;
const Eye=()=> <Ico d={<><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></>}/>;
const ROWS=[{folio:"8612-10",registro:"Rondín nocturno — área 4",tipo:"Rondín",estatus:"Sin incidencias"},
{folio:"8540-10",registro:"Puerta de andén forzada",tipo:"Incidencia",estatus:"Abierto"},
{folio:"8539-10",registro:"Luminaria fuera de servicio",tipo:"Falla",estatus:"En proceso"}];
function Demo(){
const [d,setD]=React.useState(ROWS[1]);
return (<div style={{padding:24,height:"100%",boxSizing:"border-box"}}>
<div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:16}}>
<span style={{fontSize:24,fontWeight:700,letterSpacing:"-0.02em"}}>Bitácoras</span><KpiChip value={3}/>
</div>
<DataTable onFilterToggle={()=>{}} rows={ROWS} columns={[
{header:"Opciones",width:"70px",cell:r=><RowAction label="Ver detalle" icon={<Eye/>} onClick={()=>setD(r)}/>},
{header:"Folio",key:"folio"},{header:"Registro",key:"registro"},{header:"Tipo",key:"tipo"},
{header:"Estatus",cell:r=><EstatusBadge estatus={r.estatus}/>}]}/>
<DetailPanel open={!!d} eyebrow="Detalle del registro" title={d?"#"+d.folio:""} badge={d?<EstatusBadge estatus={d.estatus}/>:null}
actions={<RowAction label="Imprimir" icon={<Print/>} size={36}/>} defaultWidth={720} storageKey="c10.card.detalle.ancho"
footerNote="Bitácora completa disponible en el expediente del folio"
footer={<Button variant="secondary" onClick={()=>setD(null)}>Cerrar</Button>} onClose={()=>setD(null)}>
{d?(<>
<DetailSection title="Seguimiento" meta="Etapa 2 de 4 · En revisión de supervisión" collapsible defaultOpen={false}/>
<DetailSection title="Ubicación del registro">
<div style={{display:"flex",gap:56,flexWrap:"wrap"}}>
<DetailField label="Caseta" value="Caseta Principal"/><DetailField label="Hora" value="03:40"/>
<DetailField label="Reportado por" value="Luis Márquez"/><DetailField label="Tipo" value={d.tipo}/>
</div></DetailSection>
<DetailSection title="Descripción"><p style={{margin:0,lineHeight:1.625,textWrap:"pretty"}}>Se detectó cerradura dañada en el andén 3 durante el recorrido de las 03:40. Se aseguró el área y se notificó a mantenimiento.</p></DetailSection>
<DetailSection title="Responsables" meta="4 involucrados" collapsible defaultOpen={false}/>
</>):null}
</DetailPanel>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
