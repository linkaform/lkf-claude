<!-- @dsCard group="Components" viewport="1280x600" name="View modes" subtitle="Los tres modos: tarjetas, lista de tarjetas y tabla" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{padding:16px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { PhotoCard, RecordListItem, DataTable, EstatusBadge, RowAction, RowActions, SegmentedControl, VIEW_MODES } = window.Clave10DesignSystem_b774bd;
const Ico=({d})=> <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const Eye=()=> <Ico d={<><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></>}/>;
const Car=()=> <Ico d={<><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18.4 7.6A2 2 0 0 0 16.5 6h-9a2 2 0 0 0-1.9 1.6L4.5 11.1C3.7 11.3 3 12.1 3 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></>}/>;
const IdCard=()=> <Ico d={<><rect width="18" height="14" x="3" y="5" rx="2"/><circle cx="9" cy="12" r="2"/><path d="M14 10h4M14 14h4"/></>}/>;
const Print=()=> <Ico d={<><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></>}/>;
const Out=()=> <Ico d={<><path d="M5 12h14M13 6l6 6-6 6"/></>}/>;
const Pin=()=> <Ico d={<><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></>}/>;
const Usr=()=> <Ico d={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>}/>;
const Cal=()=> <Ico d={<><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></>}/>;
const R=[{folio:"8612-10",nombre:"Margarita Gomez Velazquez",empresa:"Linkaform",perfil:"Auditor de Gobierno",caseta:"Caseta Principal",visita:"Juan Escutia",entrada:"2026-07-31 12:14:56",salida:"",status:"Entrada",img:"../../assets/imagery/guardia1.png"},
{folio:"8540-10",nombre:"Leyva Mabel Ivonne Castañares",empresa:"Linkaform",perfil:"Visita General",caseta:"Caseta Principal",visita:"Juan Escutia",entrada:"2026-07-28 12:24:12",salida:"",status:"Entrada",img:"../../assets/imagery/incidencia2.png"},
{folio:"8538-10",nombre:"Miguel",empresa:"Lkf",perfil:"Visita General",caseta:"Caseta Principal",visita:"Emiliano Zapata",entrada:"2026-07-27 20:16:57",salida:"2026-07-28 18:51:01",status:"Salida",img:"../../assets/imagery/empleado1.png"}];
const Acts=({r,shape})=>(<RowActions>
<RowAction label="Ver detalle" icon={<Eye/>} shape={shape}/><RowAction label="Vehículo" icon={<Car/>} shape={shape} disabled={r.status==="Salida"}/>
<RowAction label="Identificación" icon={<IdCard/>} shape={shape} disabled={r.status==="Salida"}/><RowAction label="Imprimir" icon={<Print/>} shape={shape}/>
<RowAction label="Registrar salida" icon={<Out/>} shape={shape} tone="accent" disabled={r.status==="Salida"}/></RowActions>);
function Demo(){
const [v,setV]=React.useState("cards");
return (<div>
<div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
<SegmentedControl value={v} onChange={setV} iconOnly options={VIEW_MODES}/>
</div>
{v==="cards" ? (
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>
{R.map(r=><PhotoCard key={r.folio} image={r.img} title={r.nombre} subtitle={r.empresa} folio={r.folio} estatus={r.status} perfil={r.perfil} style={{width:"auto"}}
details={[{icon:<Pin/>,label:"Ubicación",value:r.caseta},{icon:<Usr/>,label:"Visita a",value:r.visita},{icon:<Cal/>,label:"Entrada",value:r.entrada.slice(0,16)}].concat(r.salida?[{icon:<Cal/>,label:"Salida",value:r.salida.slice(0,16),tone:"danger"}]:[])}
actions={<Acts r={r} shape="circle"/>}/>)}
</div>) : v==="list" ? (
<div style={{display:"flex",flexDirection:"column",gap:16}}>
{R.map(r=><RecordListItem key={r.folio} image={r.img} thumbnails={[r.img,"../../assets/imagery/nota1.png"]} title={r.nombre} subtitle={r.empresa}
estatus={r.status} perfil={r.perfil} folio={r.folio} selectable
fields={[{label:"Caseta",value:r.caseta},{label:"Visita a",value:r.visita},{label:"Fecha de entrada",value:r.entrada},{label:"Fecha de salida",value:r.salida},{label:"Gafete",value:"No asignado"}]}
actions={<Acts r={r} shape="circle"/>}/>)}
</div>) : (
<DataTable onFilterToggle={()=>{}} rows={R} columns={[
{header:"Opciones",width:"170px",cell:r=><Acts r={r} shape="plain"/>},
{header:"Folio",key:"folio"},{header:"Visitante",key:"nombre"},
{header:"Estatus",cell:r=><EstatusBadge estatus={r.status} solid/>},
{header:"Entrada",key:"entrada"},{header:"Salida",cell:r=>r.salida||""},
{header:"Tipo",key:"perfil"},{header:"Empresa",key:"empresa"},{header:"Visita a",key:"visita"},
{header:"Caseta entrada",key:"caseta"},{header:"Gafete",cell:()=>"---"},{header:"Comentarios",cell:()=>"---"}]}/>
)}
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
