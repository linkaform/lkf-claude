<!-- @dsCard group="Colors" viewport="700x170" name="Azules del producto" subtitle="Un solo azul de acción: #2F80ED (button primary)" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.chip{width:150px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
.chip .b{height:52px}
.chip .m{padding:6px 8px;font-size:11px;line-height:1.35}
.chip .n{font-weight:600;color:var(--text-body)}
.chip .h{color:var(--text-subtle);font-family:var(--font-mono);font-size:10px}
.hero{width:206px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
.hero .b{height:52px;background:#2F80ED}
.note{margin-top:14px;font-size:11px;color:var(--text-subtle)}
.note s{color:var(--text-placeholder);font-family:var(--font-mono)}
</style></head><body>
<div class="sw">
<div class="hero"><div class="b"></div><div class="m"><div class="n">Azul de acción · button primary</div><div class="h">#2F80ED</div></div></div>
<div class="chip"><div class="b" style="background:#1E6FDB"></div><div class="m"><div class="n">Hover</div><div class="h">#1E6FDB</div></div></div>
<div class="chip"><div class="b" style="background:#EFF6FF"></div><div class="m"><div class="n">Fondo sutil</div><div class="h">#EFF6FF</div></div></div>
<div class="chip"><div class="b" style="background:#DBEAFE"></div><div class="m"><div class="n">Header de tabla</div><div class="h">#DBEAFE</div></div></div>
</div>
<div class="note">Retirados en favor de #2F80ED: <s>#3B82F6</s> · <s>#3D8BF2</s> (CTA de login) · <s>#2A7EFF</s> (selección) · <s>#EBF2FA</s> (header de tabla alterno).</div>
</body></html>
