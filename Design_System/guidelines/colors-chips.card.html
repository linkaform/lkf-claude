<!-- @dsCard group="Colors" viewport="700x170" name="Chips de estatus" subtitle="Trío fondo / borde / texto por cada estado" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.chip{width:150px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
.chip .b{height:52px}
.chip .m{padding:6px 8px;font-size:11px;line-height:1.35}
.chip .n{font-weight:600;color:var(--text-body)}
.chip .h{color:var(--text-subtle);font-family:var(--font-mono);font-size:10px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-placeholder);font-weight:600}
</style></head><body><div class="row">
<span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-chip-green-bg);color:var(--c10-chip-green-fg);border:1px solid var(--c10-chip-green-bd)">Corriendo</span><span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-chip-yellow-bg);color:var(--c10-chip-yellow-fg);border:1px solid var(--c10-chip-yellow-bd)">Pausado</span><span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-chip-blue-bg);color:var(--c10-chip-blue-fg);border:1px solid var(--c10-chip-blue-bd)">En proceso</span><span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-chip-purple-bg);color:var(--c10-chip-purple-fg);border:1px solid var(--c10-chip-purple-bd)">Programado</span><span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-chip-red-bg);color:var(--c10-chip-red-fg);border:1px solid var(--c10-chip-red-bd)">Pendiente</span><span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-chip-slate-bg);color:var(--c10-chip-slate-fg);border:1px solid var(--c10-chip-slate-bd)">Cerrado</span><span style="display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-chip-amber-bg);color:var(--c10-chip-amber-fg);border:1px solid var(--c10-chip-amber-bd)">Parcial</span>
</div>
<div class="row" style="margin-top:14px">
<span style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-success-bg);color:var(--c10-success-text)">Éxito</span><span style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-warning-bg);color:var(--c10-warning-text)">Advertencia</span><span style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-process-bg);color:var(--c10-process-text)">Proceso</span><span style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-purple-bg);color:var(--c10-purple-text)">Púrpura</span><span style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:600;background:var(--c10-magenta-bg);color:var(--c10-magenta-text)">Magenta</span>
</div></body></html>
