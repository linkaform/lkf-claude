<!-- @dsCard group="Brand" viewport="700x180" name="Logo" subtitle="Marca CLAVE 10 sobre claro y sobre azul marino" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.chip{width:150px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
.chip .b{height:52px}
.chip .m{padding:6px 8px;font-size:11px;line-height:1.35}
.chip .n{font-weight:600;color:var(--text-body)}
.chip .h{color:var(--text-subtle);font-family:var(--font-mono);font-size:10px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-placeholder);font-weight:600}
</style></head><body><div class="row" style="gap:0;align-items:stretch">
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-lg) 0 0 var(--radius-lg)"><img src="../assets/logo.png" alt="Clave 10" style="height:52px"></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--c10-navy);border-radius:0 var(--radius-lg) var(--radius-lg) 0"><img src="../assets/logo.png" alt="Clave 10" style="height:52px;filter:brightness(0) invert(1)"></div>
</div></body></html>
