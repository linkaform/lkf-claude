<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.chip{width:150px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
.chip .b{height:52px}
.chip .m{padding:6px 8px;font-size:11px;line-height:1.35}
.chip .n{font-weight:600;color:var(--text-body)}
.chip .h{color:var(--text-subtle);font-family:var(--font-mono);font-size:10px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-placeholder);font-weight:600}
</style></head><body><div class="sw">
<div class="chip"><div class="b" style="background:var(--c10-bg-app)"></div><div class="m"><div class="n">Lienzo app</div><div class="h">#FFFFFF</div></div></div><div class="chip"><div class="b" style="background:var(--c10-surface)"></div><div class="m"><div class="n">Superficie</div><div class="h">#FFFFFF</div></div></div><div class="chip"><div class="b" style="background:var(--c10-surface-sunken)"></div><div class="m"><div class="n">Hundida</div><div class="h">#F1F5F9</div></div></div><div class="chip"><div class="b" style="background:var(--c10-border)"></div><div class="m"><div class="n">Borde</div><div class="h">#E2E8F0</div></div></div><div class="chip"><div class="b" style="background:var(--c10-text-primary)"></div><div class="m"><div class="n">Texto</div><div class="h">#171717</div></div></div><div class="chip"><div class="b" style="background:var(--c10-text-secondary)"></div><div class="m"><div class="n">Secundario</div><div class="h">#475569</div></div></div><div class="chip"><div class="b" style="background:var(--c10-text-muted)"></div><div class="m"><div class="n">Tenue</div><div class="h">#64748B</div></div></div>
</div></body></html>
