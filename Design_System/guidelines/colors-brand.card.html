<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#fff;font-family:var(--font-sans);color:var(--text-body)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.chip{width:150px;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
.chip .b{height:52px}
.chip .m{padding:6px 8px;font-size:11px;line-height:1.35}
.chip .n{font-weight:600;color:var(--text-body)}
.chip .h{color:var(--text-subtle);font-family:var(--font-mono);font-size:10px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-placeholder);font-weight:600}
</style></head><body><div class="sw">
<div class="chip"><div class="b" style="background:var(--c10-navy)"></div><div class="m"><div class="n">Navy</div><div class="h">#192A4E</div></div></div><div class="chip"><div class="b" style="background:var(--c10-navy-code)"></div><div class="m"><div class="n">Navy (código)</div><div class="h">#1e2d5a</div></div></div><div class="chip"><div class="b" style="background:var(--c10-blue)"></div><div class="m"><div class="n">Blue</div><div class="h">#3B82F6</div></div></div><div class="chip"><div class="b" style="background:var(--c10-blue-hover)"></div><div class="m"><div class="n">Blue hover</div><div class="h">#2563EB</div></div></div><div class="chip"><div class="b" style="background:var(--c10-blue-light)"></div><div class="m"><div class="n">Blue light</div><div class="h">#EFF6FF</div></div></div>
</div></body></html>
